[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gofigr-jupyter-ai"
version = "0.1.1"
description = "GoFigr Assistant persona for jupyter-ai: Jupyternaut plus GoFigr domain knowledge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # Matches the jupyter-ai[jupyternaut] extra's pin range; the AMI installs
    # jupyter-ai==3.1.1 which resolves jupyternaut within this range.
    "jupyter-ai-jupyternaut>=0.1.0b0,<0.2.0",
]

# jupyter-ai discovers personas through this entry-point group; no other
# registration is needed. The persona ID becomes
# "jupyter-ai-personas::gofigr_jupyter_ai::GoFigrPersona".
[project.entry-points."jupyter_ai.personas"]
gofigr-assistant = "gofigr_jupyter_ai:GoFigrPersona"

[tool.hatch.build.targets.wheel]
packages = ["gofigr_jupyter_ai"]

# Single-source the domain knowledge from the Claude skill: the skill's
# SKILL.md + references/ are embedded as package data at build time, so
# updating the skill updates the persona on the next build -- no forked copy.
[tool.hatch.build.targets.wheel.force-include]
"../plugins/gofigr/skills/gofigr" = "gofigr_jupyter_ai/knowledge"

[tool.hatch.build.targets.sdist.force-include]
"../plugins/gofigr/skills/gofigr" = "gofigr_jupyter_ai/knowledge"
